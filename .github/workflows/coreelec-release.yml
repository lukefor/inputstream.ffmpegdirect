name: CoreELEC 21 arm release
# Builds the add-on for CoreELEC 21 Amlogic-ng.arm (e.g. AVDVPlus R10) with
# tools/coreelec/build-coreelec21-arm.sh and publishes it as a GitHub release.
# Triggered by pushing a tag ending in -CoreELEC21 (e.g. 69.2.11-CoreELEC21), or by pushing a
# commit whose message contains [coreelec-release], which tags <addon version>-CoreELEC21.

on:
  push:
    tags:
      - '*-CoreELEC21'
    branches:
      - '**'

permissions:
  contents: write

jobs:
  release:
    if: github.ref_type == 'tag' || contains(github.event.head_commit.message, '[coreelec-release]')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout add-on
        uses: actions/checkout@v5
        with:
          path: inputstream.ffmpegdirect
          fetch-depth: 0

      - name: Determine release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            version=$(awk '/<addon/{f=1} f && /version="/{match($0,/version="[^"]*"/); print substr($0,RSTART+9,RLENGTH-10); exit}' \
              inputstream.ffmpegdirect/inputstream.ffmpegdirect/addon.xml.in)
            tag="$version-CoreELEC21"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cross toolchain and build tools
        if: steps.tag.outputs.exists != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++-arm-linux-gnueabihf cmake autoconf automake autopoint \
            libtool pkg-config nasm gettext zip

      - name: Build
        if: steps.tag.outputs.exists != 'true'
        run: inputstream.ffmpegdirect/tools/coreelec/build-coreelec21-arm.sh "$GITHUB_WORKSPACE/out"

      - name: Check binary compatibility with CoreELEC 21 (glibc 2.38, GCC 13)
        if: steps.tag.outputs.exists != 'true'
        run: |
          so=$(ls out/stage/inputstream.ffmpegdirect/inputstream.ffmpegdirect.so.*)
          glibc=$(arm-linux-gnueabihf-objdump -T "$so" | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1)
          glibcxx=$(arm-linux-gnueabihf-objdump -T "$so" | grep -oE 'GLIBCXX_[0-9.]+' | sort -uV | tail -1)
          exports=$(arm-linux-gnueabihf-nm -D --defined-only "$so" | awk '{print $3}' | grep -v '^_Z' | tr '\n' ' ')
          echo "Max $glibc, max $glibcxx, C exports: $exports"
          printf '%s\n' "$glibc" GLIBC_2.38 | sort -CV
          printf '%s\n' "$glibcxx" GLIBCXX_3.4.32 | sort -CV
          [ "$exports" = "ADDON_Create ADDON_GetTypeMinVersion ADDON_GetTypeVersion " ]

      - name: Create release
        if: steps.tag.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ steps.tag.outputs.tag }}
        run: |
          # GITHUB_TOKEN may not create a tag on a commit that adds workflow files compared to the
          # default branch, so tag the latest commit that changed anything outside .github instead.
          # The add-on is built from files outside .github, so this is the same source.
          target=$(git -C inputstream.ffmpegdirect rev-list -1 "$GITHUB_SHA" -- . ':!.github')
          echo "Tagging $tag at $target"
          zip=$(ls out/*.zip)
          sha=$(sha256sum "$zip" | cut -d' ' -f1)
          {
            echo "Build of inputstream.ffmpegdirect for **CoreELEC 21 Amlogic-ng.arm** (Kodi 21 Omega, 32-bit ARM userspace), e.g. AVDVPlus R10. FFmpeg 9.0.2 is bundled."
            echo
            echo "Install: copy the zip to the box, then Add-ons > Install from zip file."
            echo
            echo "### Changes"
            awk -v RS= 'NR==1' inputstream.ffmpegdirect/inputstream.ffmpegdirect/changelog.txt | tail -n +2
            echo
            echo "SHA-256 \`$(basename "$zip")\`: \`$sha\`"
          } > notes.md
          gh release create "$tag" "$zip" --repo "$GITHUB_REPOSITORY" --target "$target" \
            --title "$tag" --notes-file notes.md
