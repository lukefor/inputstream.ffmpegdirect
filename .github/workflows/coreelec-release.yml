name: CoreELEC 21 arm release
# Builds the add-on for CoreELEC 21 Amlogic-ng.arm (e.g. AVDVPlus R10) with
# tools/coreelec/build-coreelec21-arm.sh and publishes it as a GitHub release.
# Triggered by pushing a tag ending in -CoreELEC21 (e.g. 69.2.11-CoreELEC21), or by pushing a
# commit whose message contains [coreelec-release], which tags <addon version>-CoreELEC21.

on:
  push:
    tags:
      - '*-CoreELEC21'
    branches:
      - '**'

permissions:
  contents: write

jobs:
  release:
    if: github.ref_type == 'tag' || contains(github.event.head_commit.message, '[coreelec-release]')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout add-on
        uses: actions/checkout@v5
        with:
          path: inputstream.ffmpegdirect
          fetch-depth: 0

      - name: Determine release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            version=$(awk '/<addon/{f=1} f && /version="/{match($0,/version="[^"]*"/); print substr($0,RSTART+9,RLENGTH-10); exit}' \
              inputstream.ffmpegdirect/inputstream.ffmpegdirect/addon.xml.in)
            tag="$version-CoreELEC21"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cross toolchain and build tools
        if: steps.tag.outputs.exists != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++-arm-linux-gnueabihf cmake autoconf automake autopoint \
            libtool pkg-config nasm gettext zip

      - name: Build
        if: steps.tag.outputs.exists != 'true'
        run: inputstream.ffmpegdirect/tools/coreelec/build-coreelec21-arm.sh "$GITHUB_WORKSPACE/out"

      - name: Check binary compatibility with CoreELEC 21 (glibc 2.38, GCC 13)
        if: steps.tag.outputs.exists != 'true'
        run: |
          so=$(ls out/stage/inputstream.ffmpegdirect/inputstream.ffmpegdirect.so.*)
          glibc=$(arm-linux-gnueabihf-objdump -T "$so" | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1)
          glibcxx=$(arm-linux-gnueabihf-objdump -T "$so" | grep -oE 'GLIBCXX_[0-9.]+' | sort -uV | tail -1)
          exports=$(arm-linux-gnueabihf-nm -D --defined-only "$so" | awk '{print $3}' | grep -v '^_Z' | tr '\n' ' ')
          echo "Max $glibc, max $glibcxx, C exports: $exports"
          printf '%s\n' "$glibc" GLIBC_2.38 | sort -CV
          printf '%s\n' "$glibcxx" GLIBCXX_3.4.32 | sort -CV
          [ "$exports" = "ADDON_Create ADDON_GetTypeMinVersion ADDON_GetTypeVersion " ]

      - name: Create release
        if: steps.tag.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ steps.tag.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        working-directory: inputstream.ffmpegdirect
        run: |
          zip=$(ls "$GITHUB_WORKSPACE"/out/*.zip)
          sha=$(sha256sum "$zip" | cut -d' ' -f1)
          {
            echo "Build of inputstream.ffmpegdirect for **CoreELEC 21 Amlogic-ng.arm** (Kodi 21 Omega, 32-bit ARM userspace), e.g. AVDVPlus R10. FFmpeg 9.0.2 is bundled."
            echo
            echo "Install: copy the zip to the box, then Add-ons > Install from zip file."
            echo
            echo "### Changes"
            awk -v RS= 'NR==1' inputstream.ffmpegdirect/changelog.txt | tail -n +2
            echo
            echo "Built from $GITHUB_REF_NAME at $GITHUB_SHA."
            echo
            echo "SHA-256 \`$(basename "$zip")\`: \`$sha\`"
          } > "$RUNNER_TEMP/notes.md"

          # GITHUB_TOKEN may not create a tag on a commit whose workflow files differ from the
          # default branch (HTTP 403). Tag a commit with this commit's add-on source and the
          # default branch's .github directory instead, the add-on is built from the former only.
          git fetch -q origin "$DEFAULT_BRANCH"
          export GIT_INDEX_FILE="$RUNNER_TEMP/release-index"
          git read-tree "$GITHUB_SHA"
          git rm -r -q --cached .github
          git read-tree --prefix=.github/ "origin/$DEFAULT_BRANCH:.github"
          tree=$(git write-tree)
          unset GIT_INDEX_FILE
          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_COMMITTER_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(git commit-tree "$tree" -p "$GITHUB_SHA" \
            -m "Release $tag" -m "Add-on source of $GITHUB_SHA with the .github directory of $DEFAULT_BRANCH.")
          echo "Tagging $tag at $commit"

          if git push origin "$commit:refs/tags/$tag"; then
            gh release create "$tag" "$zip" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          else
            # A draft does not create the tag until it is published
            echo "::warning::Could not create tag $tag, creating a draft release to be published manually"
            gh release create "$tag" "$zip" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          fi
